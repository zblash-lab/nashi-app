      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Paketleme ve aktarım testleri
        run: |
          node --test android/tests/android-bridge.test.mjs
          python3 -m unittest discover -s android/tests -p test_packaging.py -v
      - name: Gerçek çalışma zamanı bağımlılıklarını çöz
        run: gradle -p android :app:exportRuntimeComponents --no-daemon
      - name: Lisansları denetle
        run: python3 android/scripts/audit_licenses.py --components android/app/build/reports/runtime-components.json --output android/build/reports/license-audit.json
      - name: Android testleri, lint ve APK
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: APK imzasını ve özetini doğrula
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nashi-kisisel-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/build/reports/license-audit.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nashi-android-test-raporlari
          path: |
            android/app/build/reports/
            android/app/build/outputs/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
