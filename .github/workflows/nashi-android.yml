# Upload this YAML and erbapp-android-sources.zip together to .github/workflows/.
name: Erbapp Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nashi-android.yml'
      - '.github/workflows/erbapp-android-sources.zip'
      - 'android/**'
      - 'docs/**'
      - 'Resources/licenses/**'
      - 'LICENSE'
permissions:
  contents: read
concurrency:
  group: erbapp-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Doğrulanan Android kaynak paketini aç
        run: |
          python3 - <<'PY'
          import hashlib,io,pathlib,zipfile
          if pathlib.Path("android/app/build.gradle.kts").is_file():
              print("Using checked-in Android sources.")
          else:
              package=pathlib.Path(".github/workflows/erbapp-android-sources.zip")
              if not package.is_file():
                  raise RuntimeError("erbapp-android-sources.zip dosyasını ZIP olarak .github/workflows klasörüne yükle.")
              data=package.read_bytes()
              if hashlib.sha256(data).hexdigest()!='59a89ab01dd667343fd34d89ba8671611717a121b39cada459f2e44e0841b734':
                  raise RuntimeError("Kaynak ZIP özeti eşleşmiyor. Aynı teslimattaki YAML ve ZIP dosyalarını birlikte yükle.")
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for info in archive.infolist():
                      path=pathlib.PurePosixPath(info.filename)
                      assert not path.is_absolute() and ".." not in path.parts and path.parts[0]=="android"
                      assert ((info.external_attr >> 16) & 0o170000) != 0o120000
                  archive.extractall(".")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kalıcı imza ayarını doğrula
        env:
          ERBAPP_SIGNING: ${{ secrets.ERBAPP_SIGNING }}
        run: python3 android/scripts/sign_apk.py --check
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Paketleme ve aktarım testleri
        run: |
          mkdir -p android/build/reports/ci
          node --test --test-isolation=none android/tests/*.test.mjs 2>&1 | tee android/build/reports/ci/bridge-tests.log
          python3 -m unittest discover -s android/tests -p 'test_*.py' -v 2>&1 | tee android/build/reports/ci/python-tests.log
      - name: Web runtime lisanslarını ve bütünlüğünü denetle
        run: python3 android/scripts/audit_web_vendor.py --output android/build/reports/web-vendor-licenses.json
      - name: Tarayıcı test aracını kur
        run: python3 -m pip install --disable-pip-version-check playwright==1.55.0 pypdf==6.10.0
      - name: Gerçek çalışma zamanı bağımlılıklarını çöz
        id: runtime_components
        run: gradle -p android :app:exportRuntimeComponents --no-daemon --stacktrace 2>&1 | tee android/build/reports/ci/runtime-resolution.log
      - name: Kotlin kaynaklarını derle
        if: ${{ !cancelled() && steps.runtime_components.outcome == 'success' }}
        run: gradle -p android :app:compileDebugKotlin --no-daemon --continue --stacktrace 2>&1 | tee android/build/reports/ci/kotlin-compile.log
      - name: Lisansları denetle
        id: licenses
        if: ${{ !cancelled() && steps.runtime_components.outcome == 'success' }}
        run: python3 android/scripts/audit_licenses.py --components android/app/build/reports/runtime-components.json --output android/build/reports/license-audit.json 2>&1 | tee android/build/reports/ci/license-audit.log
      - name: Android testleri, lint ve APK
        if: ${{ !cancelled() && steps.runtime_components.outcome == 'success' && steps.licenses.outcome == 'success' }}
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --continue --stacktrace 2>&1 | tee android/build/reports/ci/android-build.log
      - name: APK içindeki arayüz ve gerçek çıktı testleri
        run: python3 android/scripts/browser_acceptance.py --android-only --android android/app/build/generated/nashiAssets --repo . --output android/build/reports/browser 2>&1 | tee android/build/reports/ci/browser-tests.log
      - name: Oluşan gerçek PNG ve PDF dosyalarının içeriğini doğrula
        run: python3 android/scripts/verify_converter_outputs.py --android-only --folder android/build/reports/browser --node-pdf android/build/reports/epub/turkce-kitap.pdf 2>&1 | tee android/build/reports/ci/converter-outputs.log
      - name: Erbapp APK imzala ve sertifikasını doğrula
        env:
          ERBAPP_SIGNING: ${{ secrets.ERBAPP_SIGNING }}
        run: |
          python3 android/scripts/sign_apk.py \
            --input android/app/build/outputs/apk/debug/app-debug.apk \
            --output android/app/build/outputs/erbapp/Erbapp.apk \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: APK kimliğini ve başlatıcısını doğrula
        run: python3 android/scripts/verify_apk_branding.py --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --apk android/app/build/outputs/erbapp/Erbapp.apk --output android/build/reports/apk-branding.json 2>&1 | tee android/build/reports/ci/apk-branding.log
      - uses: actions/upload-artifact@v4
        id: apk_artifact
        with:
          name: erbapp-apk
          path: |
            android/app/build/outputs/erbapp/Erbapp.apk
            android/app/build/outputs/erbapp/SHA256SUMS.txt
            android/app/build/outputs/erbapp/signing-info.json
            android/build/reports/license-audit.json
          retention-days: 7
      - name: Derleme sonucunu raporla
        if: always()
        env:
          APK_ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
        run: python3 android/scripts/ci_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erbapp-test-raporlari
          path: |
            android/build/reports/
            android/app/build/reports/
            android/app/build/outputs/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
